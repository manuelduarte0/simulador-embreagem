<!DOCTYPE html>
<html>
<head>
  <title>Simulador Embreagem</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; user-select: none; }
    body { 
      height: 100vh; overflow: hidden; font-family: Arial;
      background: url('carro.jpg') no-repeat center center;
      background-size: cover;
    }
    
    #hud {
      position: absolute; top: 20px; left: 50%; transform: translateX(-50%);
      background: rgba(0,0,0,0.7); color: #0F0; padding: 10px 20px;
      border-radius: 10px; text-align: center; font-weight: bold;
      border: 2px solid #0F0; text-shadow: 0 0 5px #0F0;
    }
    #velocidade { font-size: 28px; }
    #marcha-display { font-size: 20px; margin-top: 5px; }
    #status { 
      position: absolute; top: 120px; left: 50%; transform: translateX(-50%);
      background: rgba(255,0,0,0.8); color: white; padding: 8px 15px;
      border-radius: 20px; font-size: 16px; display: none;
    }

    #pedais {
      position: absolute; bottom: 10px; width: 100%; height: 180px;
      display: flex; justify-content: center; align-items: flex-end; gap: 15px;
    }
    
    .pedal {
      width: 70px; height: 130px; background: #000; 
      border: 3px solid #333; border-radius: 8px 8px 30px 30px;
      position: relative; transition: all 0.1s; cursor: pointer;
      box-shadow: inset 0 -10px 20px rgba(0,0,0,0.8);
    }
    .pedal.ativo { background: #00FF00; box-shadow: 0 0 15px #00FF00; }
    .pedal-label {
      position: absolute; bottom: -25px; width: 100%; text-align: center;
      color: white; font-size: 11px; font-weight: bold;
      text-shadow: 1px 1px 2px #000;
    }
    
    #embreagem { transform: translateY(0px); }
    #embreagem.pisada { transform: translateY(-30px); } /* sobe quando pisa */
    
    #cambio {
      position: absolute; bottom: 30px; right: 20px;
      background: rgba(0,0,0,0.8); padding: 10px; border-radius: 10px;
      display: flex; flex-direction: column; gap: 8px;
    }
    .marcha-btn {
      width: 50px; height: 35px; background: #000; color: #FFF;
      border: 2px solid #444; border-radius: 5px; font-weight: bold;
    }
    .marcha-btn.ativa { background: #00FF00; color: #000; }

    #pista {
      position: absolute; top: 0; left: 0; width: 100%; height: 100%;
      background: url('carro.jpg') no-repeat center center;
      background-size: cover; z-index: -1;
    }
    #pista.andando {
      animation: tremerPista 0.2s infinite;
    }
    @keyframes tremerPista { 
      0%,100% { transform: translateX(0); } 
      50% { transform: translateX(-1px); } 
    }
  </style>
</head>
<body>
  <div id="pista"></div>
  
  <div id="hud">
    <div id="velocidade">0 km/h</div>
    <div id="marcha-display">N</div>
  </div>
  
  <div id="status">MORREU!</div>

  <div id="pedais">
    <div class="pedal" id="embreagem">
      <div class="pedal-label">EMBREAGEM</div>
    </div>
    <div class="pedal" id="freio">
      <div class="pedal-label">FREIO</div>
    </div>
    <div class="pedal" id="acelerador">
      <div class="pedal-label">ACELERADOR</div>
    </div>
  </div>

  <div id="cambio">
    <button class="marcha-btn ativa" data-marcha="N">N</button>
    <button class="marcha-btn" data-marcha="1">1</button>
    <button class="marcha-btn" data-marcha="2">2</button>
    <button class="marcha-btn" data-marcha="3">3</button>
  </div>

<script>
  let estado = {
    embreagem: 0, // 0 solta, 100 pisada
    acelerador: 0,
    freio: 0,
    marcha: 'N',
    velocidade: 0,
    carroLigado: false,
    morreu: false
  };

  const embreagemEl = document.getElementById('embreagem');
  const aceleradorEl = document.getElementById('acelerador');
  const freioEl = document.getElementById('freio');
  const velocidadeEl = document.getElementById('velocidade');
  const marchaEl = document.getElementById('marcha-display');
  const statusEl = document.getElementById('status');
  const pistaEl = document.getElementById('pista');

  // EMBREAGEM - segurar pra pisar
  embreagemEl.addEventListener('touchstart', (e) => { e.preventDefault(); pisarEmbreagem(); });
  embreagemEl.addEventListener('mousedown', () => pisarEmbreagem());
  embreagemEl.addEventListener('touchend', () => soltarEmbreagem());
  embreagemEl.addEventListener('mouseup', () => soltarEmbreagem());

  // ACELERADOR
  aceleradorEl.addEventListener('touchstart', (e) => { e.preventDefault(); pisarAcelerador(); });
  aceleradorEl.addEventListener('mousedown', () => pisarAcelerador());
  aceleradorEl.addEventListener('touchend', () => soltarAcelerador());
  aceleradorEl.addEventListener('mouseup', () => soltarAcelerador());

  // FREIO
  freioEl.addEventListener('touchstart', (e) => { e.preventDefault(); estado.freio = 100; });
  freioEl.addEventListener('mousedown', () => estado.freio = 100);
  freioEl.addEventListener('touchend', () => estado.freio = 0);
  freioEl.addEventListener('mouseup', () => estado.freio = 0);

  // MARCHAS
  document.querySelectorAll('.marcha-btn').forEach(btn => {
    btn.addEventListener('click', () => tentarTrocarMarcha(btn.dataset.marcha));
  });

  function pisarEmbreagem() {
    estado.embreagem = 100;
    embreagemEl.classList.add('ativo');
    embreagemEl.classList.add('pisada'); // sobe
  }

  function soltarEmbreagem() {
    // Solta devagar - isso é o controle de embreagem
    let soltando = setInterval(() => {
      estado.embreagem -= 3;
      embreagemEl.style.transform = `translateY(${-30 * estado.embreagem / 100}px)`;
      
      if (estado.embreagem <= 0) {
        estado.embreagem = 0;
        embreagemEl.classList.remove('ativo');
        embreagemEl.classList.remove('pisada');
        clearInterval(soltando);
      }
      verificarSaida();
    }, 30);
  }

  function pisarAcelerador() {
    estado.acelerador = 100;
    aceleradorEl.classList.add('ativo');
    verificarSaida();
  }

  function soltarAcelerador() {
    estado.acelerador = 0;
    aceleradorEl.classList.remove('ativo');
  }

  function tentarTrocarMarcha(novaMarcha) {
    if (estado.embreagem < 90) {
      mostrarStatus('Pisa na embreagem primeiro!');
      return;
    }
    estado.marcha = novaMarcha;
    document.querySelectorAll('.marcha-btn').forEach(b => b.classList.remove('ativa'));
    document.querySelector(`[data-marcha="${novaMarcha}"]`).classList.add('ativa');
    marchaEl.innerText = novaMarcha;
    
    // Regra: quando troca marcha, embreagem verde e acelerador preto
    aceleradorEl.classList.remove('ativo');
    estado.acelerador = 0;
  }

  function verificarSaida() {
    // Lógica pra sair: 1ª marcha + acelerador + soltando embreagem
    if (estado.marcha === '1' && estado.acelerador > 50 && estado.embreagem < 60 && estado.embreagem > 20) {
      if (!estado.carroLigado) {
        estado.carroLigado = true;
        statusEl.style.display = 'none';
      }
    }
    
    // Morreu: tentou sair sem aceleração ou soltou rápido demais
    if (estado.marcha !== 'N' && estado.embreagem < 15 && estado.acelerador < 20 && estado.velocidade < 3) {
      morrerCarro();
    }

    // Quando carro já anda, embreagem volta pro preto e acelerador fica verde
    if (estado.carroLigado && estado.velocidade > 5) {
      embreagemEl.classList.remove('ativo');
    }
  }

  function morrerCarro() {
    estado.morreu = true;
    estado.carroLigado = false;
    estado.velocidade = 0;
    mostrarStatus('MORREU! Volta pro N e pisa na embreagem');
    pistaEl.classList.remove('andando');
  }

  function mostrarStatus(texto) {
    statusEl.innerText = texto;
    statusEl.style.display = 'block';
    setTimeout(() => statusEl.style.display = 'none', 2000);
  }

  // Loop principal
  setInterval(() => {
    // Aceleração só se tiver marcha, embreagem soltando e acelerador pisado
    if (estado.carroLigado && estado.marcha !== 'N' && estado.embreagem < 70) {
      estado.velocidade += (estado.acelerador / 100) * (estado.marcha * 0.15);
      let velMax = estado.marcha * 25;
      if (estado.velocidade > velMax) estado.velocidade = velMax;
    }
    
    if (estado.freio > 0) estado.velocidade -= 0.8;
    estado.velocidade *= 0.98; // atrito
    if (estado.velocidade < 0.5) estado.velocidade = 0;

    // Atualiza UI
    velocidadeEl.innerText = Math.floor(estado.velocidade) + ' km/h';
    
    if (estado.velocidade > 2) {
      pistaEl.classList.add('andando');
    } else {
      pistaEl.classList.remove('andando');
      if (estado.velocidade === 0) estado.carroLigado = false;
    }

    // Reset após morrer
    if (estado.morreu && estado.embreagem > 90 && estado.marcha === 'N') {
      estado.morreu = false;
      statusEl.style.display = 'none';
    }
  }, 50);
</script>
</body>
</html>
