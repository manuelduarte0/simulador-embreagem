<!DOCTYPE html>
<html>
<head>
  <title>Simulador Embreagem</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; user-select: none; -webkit-tap-highlight-color: transparent; }
    body { 
      height: 100vh; overflow: hidden; font-family: Arial; background: #000;
    }
    #cenario {
      position: absolute; width: 100%; height: 100%;
      background: url('carro.jpg') no-repeat center center;
      background-size: cover;
    }
    #pista {
      position: absolute; top: 0; left: 0; width: 100%; height: 55%;
      background: linear-gradient(#87CEEB 0%, #E0C9A6 100%);
      z-index: 1; overflow: hidden;
    }
    #estrada {
      position: absolute; bottom: 0; width: 100%; height: 100%;
      background: repeating-linear-gradient(0deg, #333 0px, #333 40px, #FFF 40px, #FFF 45px, #333 45px, #333 200px);
    }
    #estrada.andando { animation: rolar 0.2s linear infinite; }
    @keyframes rolar { from { background-position: 0 0; } to { background-position: 0 200px; } }

    #hud {
      position: absolute; top: 15px; left: 50%; transform: translateX(-50%);
      background: rgba(0,0,0,0.9); color: #0F0; padding: 10px 20px;
      border-radius: 8px; text-align: center; font-weight: bold;
      border: 2px solid #0F0; text-shadow: 0 0 8px #0F0; z-index: 10;
    }
    #velocidade { font-size: 30px; }
    #marcha-display { font-size: 20px; margin-top: 3px; }
    
    #debug {
      position: absolute; top: 100px; left: 10px;
      background: rgba(0,0,0,0.7); color: #FFF; padding: 5px;
      font-size: 12px; z-index: 10; font-family: monospace;
    }

    #pedais {
      position: absolute; bottom: 10px; width: 100%; height: 160px;
      display: flex; justify-content: center; align-items: flex-end; gap: 18px; z-index: 10;
    }
    .pedal {
      width: 75px; height: 140px; background: #111; 
      border: 3px solid #444; border-radius: 10px 10px 35px 35px;
      position: relative; transition: transform 0.05s; cursor: pointer;
    }
    .pedal.ativo { background: #00FF00; box-shadow: 0 0 25px #00FF00; }
    .pedal-label {
      position: absolute; bottom: -25px; width: 100%; text-align: center;
      color: white; font-size: 11px; font-weight: bold; text-shadow: 2px 2px 3px #000;
    }
    #embreagem { transform: translateY(0px); }
    #embreagem.pisada { transform: translateY(-35px); }
    
    #cambio {
      position: absolute; bottom: 35px; right: 12px;
      background: rgba(0,0,0,0.9); padding: 10px; border-radius: 12px;
      display: flex; flex-direction: column; gap: 8px; z-index: 10; border: 2px solid #333;
    }
    .marcha-btn {
      width: 55px; height: 38px; background: #000; color: #FFF;
      border: 2px solid #555; border-radius: 6px; font-weight: bold; font-size: 16px;
    }
    .marcha-btn.ativa { background: #00FF00; color: #000; border-color: #00FF00; }
  </style>
</head>
<body>
  <div id="cenario">
    <div id="pista"><div id="estrada"></div></div>
  </div>
  
  <div id="hud">
    <div id="velocidade">0 km/h</div>
    <div id="marcha-display">N</div>
  </div>
  
  <div id="debug">EMB: 0 | ACE: 0 | MARCHA: N</div>

  <div id="pedais">
    <div class="pedal" id="embreagem"><div class="pedal-label">EMBREAGEM</div></div>
    <div class="pedal" id="freio"><div class="pedal-label">FREIO</div></div>
    <div class="pedal" id="acelerador"><div class="pedal-label">ACELERADOR</div></div>
  </div>

  <div id="cambio">
    <button class="marcha-btn ativa" data-marcha="N">N</button>
    <button class="marcha-btn" data-marcha="1">1</button>
    <button class="marcha-btn" data-marcha="2">2</button>
    <button class="marcha-btn" data-marcha="3">3</button>
  </div>

<script>
  let embreagem = 0, acelerador = 0, freio = 0;
  let marcha = 'N', velocidade = 0;
  
  const embreagemEl = document.getElementById('embreagem');
  const aceleradorEl = document.getElementById('acelerador');
  const freioEl = document.getElementById('freio');
  const velocidadeEl = document.getElementById('velocidade');
  const marchaEl = document.getElementById('marcha-display');
  const estradaEl = document.getElementById('estrada');
  const debugEl = document.getElementById('debug');

  // EMBREAGEM
  function pisarEmb() { embreagem = 100; embreagemEl.classList.add('ativo', 'pisada'); }
  function soltarEmb() {
    let i = setInterval(() => {
      embreagem -= 5;
      embreagemEl.style.transform = `translateY(${-35 * embreagem / 100}px)`;
      if (embreagem <= 0) {
        embreagem = 0;
        embreagemEl.classList.remove('ativo', 'pisada');
        clearInterval(i);
      }
    }, 40);
  }
  embreagemEl.ontouchstart = embreagemEl.onmousedown = (e) => { e.preventDefault(); pisarEmb(); };
  embreagemEl.ontouchend = embreagemEl.onmouseup = () => soltarEmb();

  // ACELERADOR
  aceleradorEl.ontouchstart = aceleradorEl.onmousedown = (e) => { e.preventDefault(); acelerador = 100; aceleradorEl.classList.add('ativo'); };
  aceleradorEl.ontouchend = aceleradorEl.onmouseup = () => { acelerador = 0; aceleradorEl.classList.remove('ativo'); };

  // FREIO
  freioEl.ontouchstart = freioEl.onmousedown = (e) => { e.preventDefault(); freio = 100; freioEl.classList.add('ativo'); };
  freioEl.ontouchend = freioEl.onmouseup = () => { freio = 0; freioEl.classList.remove('ativo'); };

  // MARCHAS
  document.querySelectorAll('.marcha-btn').forEach(btn => {
    btn.onclick = () => {
      if (embreagem < 80) return; // só troca pisado fundo
      marcha = btn.dataset.marcha;
      document.querySelectorAll('.marcha-btn').forEach(b => b.classList.remove('ativa'));
      btn.classList.add('ativa');
      marchaEl.innerText = marcha;
      acelerador = 0; aceleradorEl.classList.remove('ativo'); // regra: troca marcha corta acelerador
    };
  });

  // LOOP PRINCIPAL - SIMPLIFICADO
  setInterval(() => {
    // Lógica de movimento: SE tiver marcha + acelerador + embreagem soltando = ANDA
    if (marcha !== 'N' && acelerador > 20) {
      let forca = (acelerador / 100) * ((100 - embreagem) / 100); // quanto mais solta a embreagem, mais anda
      velocidade += forca * 0.6;
    }

    // Freio e atrito
    if (freio > 0) velocidade -= 1.5;
    velocidade *= 0.97;
    if (velocidade < 0.3) velocidade = 0;

    // Limite por marcha
    let velMax = { 'N': 0, '1': 35, '2': 65, '3': 100 }[marcha];
    if (velocidade > velMax) velocidade = velMax;

    // UI
    velocidadeEl.innerText = Math.floor(velocidade) + ' km/h';
    debugEl.innerText = `EMB: ${Math.floor(embreagem)} | ACE: ${acelerador} | MARCHA: ${marcha}`;
    
    if (velocidade > 0.5) {
      estradaEl.classList.add('andando');
      estradaEl.style.animationDuration = (0.4 - velocidade/250) + 's';
    } else {
      estradaEl.classList.remove('andando');
    }

    // Quando anda, embreagem volta pro preto
    if (velocidade > 5 && embreagem < 30) embreagemEl.classList.remove('ativo');
    
  }, 50);
</script>
</body>
</html>
